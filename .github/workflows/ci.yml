name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

# A newer run cancels the older one of the same ref: a branch's pushes, or one pull request's
# commits. A push and a pull request never share a ref, so a release PR opened right after its
# push to develop leaves that push's run alone; a cancelled gate would block the merge into master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Format, build, test (same script as the pre-push hook)
        shell: bash
        run: scripts/check.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
