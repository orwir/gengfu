name: Release

# A dispatch on the commit the release review read releases the version in Directory.Build.props:
# the refusals, the CI gate, a self-contained build that Velopack packs into Setup.exe, a full
# package and a delta from the last release, a test install, then the GitHub Release and its tag,
# last, so a failed run publishes and tags nothing. Why: ADR-0006 and ADR-0008. How:
# docs/guides/release.md.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit the release review read, as a full SHA
        required: true

# One release at a time, never cancelled: a second dispatch waits for the first, then meets its tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The refusal steps keep the kickstart recipe's names: `lifecycle release` reads them to say why
  # a release was refused.
  refuse:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pre: ${{ steps.version.outputs.pre }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a ref other than the integration or a hotfix branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/heads/hotfix/*) ;;
            *) echo "::error::$GITHUB_REF is not main or a hotfix branch"; exit 1 ;;
          esac

      - name: Refuse a head the review did not read
        env:
          REVIEWED: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_SHA" != "$REVIEWED" ]; then
            echo "::error::the branch moved since the review: its head is $GITHUB_SHA"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Gengfu.Core targets plain net10.0, so it evaluates on Linux; its <Version> is the app's.
      - name: Read the version
        id: version
        run: |
          version="$(dotnet msbuild src/Gengfu.Core/Gengfu.Core.csproj -getProperty:Version)"
          if [[ "$version" == *-dev* ]]; then
            echo "::error::$version is a development version: set the release's <Version> in Directory.Build.props."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A test build, such as 0.1.0-rc.1, is a pre-release: only installed test builds take it.
          if [[ "$version" == *-* ]]; then
            echo "pre=--pre" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a version released already
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Exit 2 is "no such tag"; anything else, a failed read included, refuses.
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null && found=0 || found=$?
          if [ "$found" -ne 2 ]; then
            echo "::error::v$VERSION is tagged already, or the tags could not be read: bump <Version> in Directory.Build.props."
            exit 1
          fi

  gate:
    needs: refuse
    uses: ./.github/workflows/ci.yml

  release:
    needs: [refuse, gate]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      VERSION: ${{ needs.refuse.outputs.version }}
      PRE: ${{ needs.refuse.outputs.pre }}
    steps:
      - uses: actions/checkout@v7

      # A re-run keeps its first dispatch's head and inputs, and re-running only the failed jobs
      # skips refuse: read the live head and the tags again before anything is built.
      - name: Refuse a head the review did not read
        shell: bash
        env:
          REVIEWED: ${{ inputs.commit }}
        run: |
          LIVE=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1) || { echo "::error::$GITHUB_REF could not be read"; exit 1; }
          if [ "$LIVE" != "$REVIEWED" ]; then
            echo "::error::the branch moved since the review: its head is $LIVE"; exit 1
          fi

      - name: Refuse a version released already
        shell: bash
        run: |   # exit 2 is "no such tag"; anything else, a failed read included, refuses
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null && found=0 || found=$?
          if [ "$found" -ne 2 ]; then
            echo "::error::v$VERSION is tagged already, or the tags could not be read"; exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Write the release notes
        shell: bash
        run: bash scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Build, self-contained
        run: dotnet publish src/Gengfu.App/Gengfu.App.csproj -c Release -r win-x64 --self-contained -o publish

      # At the Velopack package's own version, so bumping the package moves both: a build packed by
      # another vpk version may not update.
      - name: Install vpk
        shell: bash
        run: |
          velopack="$(sed -n 's/.*Include="Velopack" Version="\([^"]*\)".*/\1/p' src/Gengfu.App/Gengfu.App.csproj)"
          if [ -z "$velopack" ]; then
            echo "::error::No Velopack version found in src/Gengfu.App/Gengfu.App.csproj, so vpk can't be matched to it."
            exit 1
          fi
          dotnet tool install --global vpk --version "$velopack"

      - name: Fetch the last release, to pack the delta from
        shell: bash
        run: vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" $PRE -o releases

      - name: Pack
        shell: bash
        run: >-
          vpk pack --packId Gengfu --packVersion "$VERSION"
          --packTitle Gengfu --packAuthors orwir --packDir publish --mainExe Gengfu.exe
          --icon src/Gengfu.App/Gengfu.ico --releaseNotes release-notes.md
          --runtime win-x64 --noPortable -o releases

      - name: Install and start it, as a player would
        shell: pwsh
        run: scripts/smoke-install.ps1 -Releases releases

      - name: Publish, with the tag
        shell: bash
        run: >-
          vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN" -o releases --publish
          --tag "v$VERSION" --targetCommitish "$GITHUB_SHA"
          --releaseName "Gengfu $VERSION" $PRE
